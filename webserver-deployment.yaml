apiVersion: apps/v1
kind: Deployment
metadata:
  name: webserver-deploy
spec:
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      labels:
        app: webserver
    spec:
      containers:
      - name: webserver-con
        image: halitcamdev/web-server:1.0.0
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: shared-secret
        - configMapRef:
            name: servers-configmap
