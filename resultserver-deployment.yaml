apiVersion: apps/v1
kind: Deployment
metadata:
  name: resultserver-deploy
spec:
  selector:
    matchLabels:
      app: resultserver
  template:
    metadata:
      labels:
        app: resultserver
    spec:
      containers:
      - name: resultserver-con
        image: halitcamdev/result-server:1.0.0
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: shared-secret
        - configMapRef:
            name: servers-configmap
